<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="Arial, Helvetica, sans-serif">
  <!-- Esquema del bastidor de SortiBandLLM. Escala ~0,95 px por mm. x = 0 en el eje tensor. -->
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
    <pattern id="madera" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <rect width="14" height="14" fill="#E2C391"/>
      <line x1="0" y1="7" x2="14" y2="7" stroke="#CFA86A" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1240" height="860" fill="#FFFFFF"/>

  <text x="40" y="44" font-size="26" font-weight="bold" fill="#1F4E79">Bastidor de la banda — esquema (propuesta mixta: madera o perfil + piezas impresas)</text>
  <text x="40" y="70" font-size="15" fill="#555">Lo que falta para que la banda tenga dónde apoyarse y girar. Medidas en mm, a escala aproximada.</text>

  <!-- ======================= VISTA LATERAL ======================= -->
  <text x="40" y="112" font-size="18" font-weight="bold" fill="#333">1. Vista de lado</text>

  <!-- Lateral del bastidor (detrás de la banda) -->
  <rect x="62" y="232" width="1056" height="96" rx="4" fill="#EAD2A4" fill-opacity="0.75" stroke="#A07A40" stroke-width="2"/>
  <!-- Patas -->
  <rect x="78" y="328" width="26" height="92" fill="#EAD2A4" stroke="#A07A40" stroke-width="2"/>
  <rect x="1076" y="328" width="26" height="92" fill="#EAD2A4" stroke="#A07A40" stroke-width="2"/>
  <rect x="575" y="328" width="26" height="92" fill="#EAD2A4" stroke="#A07A40" stroke-width="2"/>
  <line x1="40" y1="420" x2="1200" y2="420" stroke="#999" stroke-width="2"/>
  <text x="1150" y="438" font-size="13" fill="#888">mesa</text>

  <!-- Túnel de cámara (x = 200–360) -->
  <rect x="290" y="120" width="152" height="104" fill="#EAF1FB" stroke="#5B8BD0" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="366" cy="140" r="9" fill="#5B8BD0"/>
  <text x="300" y="168" font-size="13" fill="#2F5F9F">Túnel de cámara</text>
  <text x="300" y="186" font-size="12" fill="#2F5F9F">x = 200–360</text>
  <text x="300" y="203" font-size="12" fill="#2F5F9F">webcam + LED</text>

  <!-- Sensor IR (x = 170) -->
  <rect x="256" y="196" width="10" height="30" fill="#C0392B"/>
  <text x="208" y="190" font-size="12" fill="#C0392B">sensor IR</text>

  <!-- Soportes de servo y servos (x = 450 y 750) -->
  <rect x="514" y="160" width="46" height="34" rx="3" fill="#3A3A3A"/>
  <rect x="530" y="194" width="12" height="60" fill="#7FB3D5" stroke="#2E6E9E"/>
  <text x="498" y="152" font-size="12" fill="#333">servo + paleta 1</text>
  <rect x="799" y="160" width="46" height="34" rx="3" fill="#3A3A3A"/>
  <rect x="815" y="194" width="12" height="60" fill="#7FB3D5" stroke="#2E6E9E"/>
  <text x="783" y="152" font-size="12" fill="#333">servo + paleta 2</text>

  <!-- Banda (tramo de arriba y de abajo, alrededor de los piñones) -->
  <path d="M 128 214 L 1052 214 A 34 34 0 0 1 1052 282 L 128 282 A 34 34 0 0 1 128 214 Z" fill="none" stroke="#4A4A4A" stroke-width="7"/>
  <!-- Cama de deslizamiento (x = 50–950), justo bajo el tramo de arriba -->
  <rect x="176" y="220" width="856" height="7" fill="#F4F4F4" stroke="#888" stroke-width="1.5"/>
  <!-- Soportes de la cama hacia el lateral -->
  <rect x="236" y="227" width="10" height="16" fill="#8E7CC3"/>
  <rect x="456" y="227" width="10" height="16" fill="#8E7CC3"/>
  <rect x="716" y="227" width="10" height="16" fill="#8E7CC3"/>
  <rect x="966" y="227" width="10" height="16" fill="#8E7CC3"/>

  <!-- Eje tensor: piñón, rodamiento en porta-rodamiento con ranura -->
  <circle cx="128" cy="248" r="31" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="2"/>
  <rect x="98" y="232" width="62" height="32" rx="6" fill="#8E7CC3" opacity="0.9"/>
  <rect x="113" y="243" width="30" height="10" rx="5" fill="#FFFFFF"/>
  <circle cx="128" cy="248" r="10" fill="#B0B0B0" stroke="#333" stroke-width="2"/>
  <circle cx="128" cy="248" r="4" fill="#333"/>
  <!-- Eje motriz: piñón, rodamiento, acople y motor -->
  <circle cx="1052" cy="248" r="31" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="2"/>
  <rect x="1032" y="232" width="40" height="32" rx="6" fill="#8E7CC3" opacity="0.9"/>
  <circle cx="1052" cy="248" r="10" fill="#B0B0B0" stroke="#333" stroke-width="2"/>
  <circle cx="1052" cy="248" r="4" fill="#333"/>

  <!-- Rótulos de la vista lateral -->
  <g font-size="13" fill="#333">
    <line x1="128" y1="300" x2="170" y2="372" stroke="#555" marker-start="url(#f)"/>
    <text x="112" y="390">Eje tensor + rodamiento 608</text>
    <text x="112" y="406" fill="#6A5AA8">porta-rodamiento con ranura ±10 mm (tensar)</text>
    <line x1="1052" y1="300" x2="1010" y2="372" stroke="#555" marker-start="url(#f)"/>
    <text x="1066" y="390" text-anchor="end">Eje motriz + rodamiento 608</text>
    <text x="1066" y="406" text-anchor="end">(motor al costado: ver vista de arriba)</text>
    <line x1="700" y1="214" x2="700" y2="122" stroke="#555" marker-start="url(#f)"/>
    <text x="640" y="116">Banda de eslabones</text>
    <line x1="620" y1="226" x2="660" y2="300" stroke="#555" marker-start="url(#f)"/>
    <text x="630" y="314">Cama de deslizamiento (x = 50–950)</text>
    <line x1="466" y1="242" x2="420" y2="300" stroke="#555" marker-start="url(#f)"/>
    <text x="300" y="314" fill="#6A5AA8">Soportes de cama (impresos)</text>
    <text x="620" y="352" font-weight="bold" fill="#8A5A1A">LATERAL DEL BASTIDOR (madera/MDF o perfil, ~1.100 mm)</text>
    <text x="110" y="440" fill="#8A5A1A">pata</text>
    <text x="1040" y="440" fill="#8A5A1A">pata</text>
  </g>

  <!-- ======================= VISTA DE ARRIBA ======================= -->
  <text x="40" y="492" font-size="18" font-weight="bold" fill="#333">2. Vista desde arriba</text>

  <!-- Laterales (uno a cada lado de la banda) -->
  <rect x="62" y="520" width="1056" height="26" fill="#EAD2A4" stroke="#A07A40" stroke-width="2"/>
  <rect x="62" y="744" width="1056" height="26" fill="#EAD2A4" stroke="#A07A40" stroke-width="2"/>
  <!-- Travesaños -->
  <rect x="200" y="546" width="18" height="198" fill="#EAD2A4" stroke="#A07A40" stroke-width="1.5"/>
  <rect x="980" y="546" width="18" height="198" fill="#EAD2A4" stroke="#A07A40" stroke-width="1.5"/>
  <!-- Banda (200 mm de ancho) -->
  <rect x="128" y="550" width="924" height="190" fill="#D9D9D9" stroke="#4A4A4A" stroke-width="2"/>
  <g stroke="#BDBDBD" stroke-width="1">
    <line x1="180" y1="550" x2="180" y2="740"/><line x1="240" y1="550" x2="240" y2="740"/><line x1="300" y1="550" x2="300" y2="740"/>
    <line x1="360" y1="550" x2="360" y2="740"/><line x1="420" y1="550" x2="420" y2="740"/><line x1="480" y1="550" x2="480" y2="740"/>
    <line x1="540" y1="550" x2="540" y2="740"/><line x1="600" y1="550" x2="600" y2="740"/><line x1="660" y1="550" x2="660" y2="740"/>
    <line x1="720" y1="550" x2="720" y2="740"/><line x1="780" y1="550" x2="780" y2="740"/><line x1="840" y1="550" x2="840" y2="740"/>
    <line x1="900" y1="550" x2="900" y2="740"/><line x1="960" y1="550" x2="960" y2="740"/><line x1="1020" y1="550" x2="1020" y2="740"/>
  </g>
  <!-- Paletas en diagonal (cerradas) -->
  <line x1="524" y1="552" x2="725" y2="738" stroke="#2E6E9E" stroke-width="6"/>
  <line x1="809" y1="738" x2="1010" y2="552" stroke="#2E6E9E" stroke-width="6"/>
  <!-- Ejes (260 mm, cruzan la banda y apoyan en los laterales) -->
  <rect x="124" y="522" width="8" height="246" fill="#7F7F7F"/>
  <rect x="1048" y="522" width="8" height="246" fill="#7F7F7F"/>
  <!-- Piñones en y = 29, 100 y 171 -->
  <g fill="#FFFFFF" stroke="#4A4A4A" stroke-width="2">
    <rect x="112" y="570" width="32" height="13"/><rect x="112" y="638" width="32" height="13"/><rect x="112" y="705" width="32" height="13"/>
    <rect x="1036" y="570" width="32" height="13"/><rect x="1036" y="638" width="32" height="13"/><rect x="1036" y="705" width="32" height="13"/>
  </g>
  <!-- Porta-rodamientos -->
  <g fill="#8E7CC3" stroke="#5B4A9A" stroke-width="1.5">
    <rect x="110" y="516" width="36" height="34"/><rect x="110" y="740" width="36" height="34"/>
    <rect x="1034" y="516" width="36" height="34"/><rect x="1034" y="740" width="36" height="34"/>
  </g>
  <!-- Acople y motor (lado derecho/motriz) -->
  <rect x="1046" y="774" width="12" height="16" fill="#555"/>
  <rect x="1028" y="790" width="48" height="40" rx="20" fill="#C9A227" stroke="#8A6D0F" stroke-width="2"/>
  <g font-size="13" fill="#333">
    <text x="1084" y="784">acople 5→8 mm</text>
    <text x="1084" y="814" font-weight="bold">motor 28BYJ-48</text>
    <text x="40" y="806" fill="#6A5AA8">porta-rodamientos 608 (4, impresos)</text>
    <line x1="128" y1="790" x2="128" y2="776" stroke="#555" marker-end="url(#f)"/>
    <text x="40" y="836">ejes de acero Ø 8 × 260 mm con 3 piñones c/u (y = 29, 100, 171)</text>
    <text x="520" y="602" fill="#2E6E9E">paleta 1</text>
    <text x="880" y="602" fill="#2E6E9E">paleta 2</text>
    <text x="560" y="764" font-weight="bold" fill="#8A5A1A">laterales + travesaños (~1.100 × 330 mm en total)</text>
    <text x="760" y="536" fill="#8A5A1A">lateral</text>
  </g>

  <!-- Leyenda -->
  <g font-size="13">
    <rect x="330" y="478" width="16" height="16" fill="#EAD2A4" stroke="#A07A40"/><text x="352" y="491">Bastidor (comprar: madera/perfil)</text>
    <rect x="600" y="478" width="16" height="16" fill="#8E7CC3"/><text x="622" y="491">Piezas a imprimir (por diseñar)</text>
    <rect x="860" y="478" width="16" height="16" fill="#B0B0B0" stroke="#333"/><text x="882" y="491">Ejes y rodamientos (comprar)</text>
  </g>
</svg>
