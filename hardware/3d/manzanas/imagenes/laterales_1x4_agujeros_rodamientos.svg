<rect x="105" y="1175.6" width="175.60000000000002" height="20.8" fill="#7F8C8D" stroke="#2C3E50"/>
<text x="138.2" y="1092.4" font-size="13" font-weight="normal" fill="#555" text-anchor="middle">piñón</text>
<text x="95.0" y="1290.0" font-size="14" font-weight="bold" fill="#196F3D" text-anchor="end">ADENTRO</text>
<text x="95.0" y="1308.0" font-size="13" font-weight="normal" fill="#196F3D" text-anchor="end">(banda)</text>
<text x="290.6" y="1303.0" font-size="14" font-weight="bold" fill="#196F3D" text-anchor="start">AFUERA</text>
<text x="290.6" y="1137.6" font-size="13" font-weight="normal" fill="#1F4E79" text-anchor="start">porta-rodamiento impreso (1,2 cm)</text>
<text x="290.6" y="1191.0" font-size="13" font-weight="normal" fill="#2C3E50" text-anchor="start">← eje de 8 mm</text>
<text x="290.6" y="1224.0" font-size="13" font-weight="normal" fill="#424242" text-anchor="start">rodamiento 608, apoyado en la madera</text>
<text x="199.7" y="1277.0" font-size="13" font-weight="normal" fill="#5D4037" text-anchor="middle">lateral</text>
<text x="199.7" y="1293.0" font-size="13" font-weight="normal" fill="#5D4037" text-anchor="middle">1,9</text>
<text x="560.0" y="1060.0" font-size="20" font-weight="bold" fill="#1F4E79" text-anchor="start">4. Cómo hacerlo</text>
<text x="560.0" y="1092.0" font-size="14.5" font-weight="normal" fill="#222" text-anchor="start">1. Junten los 2 laterales con prensas, bien alineados, y marquen todo desde la punta de CARGA.</text>
<text x="560.0" y="1117.0" font-size="14.5" font-weight="normal" fill="#222" text-anchor="start">2. Taladren los dos juntos: así los ejes quedan a la misma altura en ambos lados.</text>
<text x="560.0" y="1142.0" font-size="14.5" font-weight="normal" fill="#222" text-anchor="start">3. Motriz: agujero de 14 mm (broca de paleta) en x = 106, a 6,5 cm del borde de abajo.</text>
<text x="560.0" y="1167.0" font-size="14.5" font-weight="normal" fill="#222" text-anchor="start">4. Tensor: dos agujeros de 14 mm en x = 5 y x = 7, y saquen la madera entre ellos</text>
<text x="560.0" y="1192.0" font-size="14.5" font-weight="normal" fill="#222" text-anchor="start">    (caladora o lima): queda una ranura de 3,4 × 1,4 cm.</text>
<text x="560.0" y="1217.0" font-size="14.5" font-weight="normal" fill="#222" text-anchor="start">5. Pongan el porta-rodamiento encima, al ras arriba, y marquen los 4 tornillos con él.</text>
<text x="560.0" y="1242.0" font-size="14.5" font-weight="normal" fill="#222" text-anchor="start">6. Guías de 3 mm y tornillos para madera de 4 × 25 mm (4 por pieza, 16 en total).</text>
<text x="560.0" y="1267.0" font-size="14.5" font-weight="normal" fill="#222" text-anchor="start">7. Tensor: atornillen con el eje al centro; para tensar, suelten y córranlo hasta ±1 cm.</text>
<text x="560.0" y="1292.0" font-size="14.5" font-weight="bold" fill="#C0392B" text-anchor="start">Ojo: el eje va a 6,5 cm del borde de abajo del lateral, aunque pongan suplementos.</text>
