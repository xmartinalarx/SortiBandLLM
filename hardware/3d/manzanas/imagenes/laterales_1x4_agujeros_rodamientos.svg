<text x="104.0" y="1018.0" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Contorno del porta-rodamiento impreso (va por AFUERA, al ras del borde de arriba)</text>
<text x="40.0" y="1060.0" font-size="20" font-weight="bold" fill="#1F4E79" text-anchor="start">3. Corte por el eje (visto desde la punta)</text>
