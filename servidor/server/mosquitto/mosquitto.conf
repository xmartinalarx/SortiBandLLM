# Configuración de Mosquitto para el laboratorio.
# Uso:  mosquitto -c server/mosquitto/mosquitto.conf -v
#
# Mosquitto 2.x solo acepta conexiones locales si no se declara un listener.
# Con esto el Arduino puede conectarse desde la red WiFi (abrir el puerto 1883
# en el firewall de Windows).
listener 1883 0.0.0.0

# Sin usuario ni clave: aceptable en la red del laboratorio para el MVP.
# Para producción habría que usar password_file y TLS.
allow_anonymous true
